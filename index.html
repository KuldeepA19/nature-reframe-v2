<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nature Reframe | Sanctuary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <header>
            <div class="status-bar">
                <span class="pulse"></span> 
                <span id="community-count">14,202 souls breathing with you</span>
            </div>
            <h1>Nature Reframe</h1>
        </header>

        <main id="screen-container">
            <!-- The Garden -->
            <div class="garden-area" id="garden"></div>

            <!-- The Interaction Sanctuary -->
            <section class="interaction">
                <div id="ai-response-container" class="ai-box-hidden">
                    <p id="ai-text"></p>
                </div>

                <h2 id="mood-prompt">What is weighing on your heart?</h2>
                
                <div class="mood-chips">
                    <button class="chip" onclick="updateMood('angry', '🔥 Let the heat out. What happened?')">Anger</button>
                    <button class="chip" onclick="updateMood('stressed', '🌊 Breathe. What is overwhelming you?')">Stress</button>
                    <button class="chip" onclick="updateMood('lonely', '🍃 We are here. Who do you miss?')">Loneliness</button>
                </div>

                <textarea id="thought-input" placeholder="Release your thought into the soil..."></textarea>
                
                <button class="btn-primary" onclick="releaseThought()">Plant & Release</button>
            </section>
        </main>

        <nav class="bottom-tabs">
            <div class="tab-item active">🌿</div>
            <div class="tab-item" onclick="alert('Ambient sounds coming in v3')">🎵</div>
            <div class="tab-item" onclick="alert('AI Deep Chat coming in v3')">✨</div>
        </nav>
    </div>
    <script src="app.js"></script>
</body>
</html>
